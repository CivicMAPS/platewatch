# Local or single-host deployment of the PlateWatch backend with PostgreSQL (docs/BACKEND.md).
#   cp .env.example .env   # set the two tokens
#   docker compose up --build
# Console: http://localhost:8787/console/   App: http://localhost:8787/
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: platewatch
      POSTGRES_PASSWORD: platewatch
      POSTGRES_DB: platewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platewatch"]
      interval: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://platewatch:platewatch@db:5432/platewatch
      PLATEWATCH_DEVICE_TOKEN: ${PLATEWATCH_DEVICE_TOKEN:?set PLATEWATCH_DEVICE_TOKEN in .env}
      PLATEWATCH_CONSOLE_TOKEN: ${PLATEWATCH_CONSOLE_TOKEN:?set PLATEWATCH_CONSOLE_TOKEN in .env}
      PLATEWATCH_COUNCIL: ${PLATEWATCH_COUNCIL:-com}
      PLATEWATCH_CORS_ORIGINS: ${PLATEWATCH_CORS_ORIGINS:-*}
    ports:
      - "8787:8787"
volumes:
  pgdata:
